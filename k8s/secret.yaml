# IMPORTANT: Replace all values below with real secrets before deploying.
# Never commit real credentials to source control.
# Use Sealed Secrets, Vault, or a CI/CD secrets manager for production.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: ai-agent-platform
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_WITH_DB_USER"
  POSTGRES_PASSWORD: "REPLACE_WITH_SECURE_PASSWORD"
  DATABASE_URL: "REPLACE_WITH_FULL_DSN"
